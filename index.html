<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>订阅中转</title>
</head>
<body>
<script>
fetch("code.txt")
.then(res => res.text())
.then(b64Str => {
    //解码Base64，解决中文频道乱码
    const bytes = Uint8Array.from(atob(b64Str), c => c.charCodeAt(0))
    const result = new TextDecoder("utf-8").decode(bytes)
    document.write(result)
})
</script>
</body>
</html>
